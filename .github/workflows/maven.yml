name: Java CI with Maven

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compilar proyecto
      run: mvn -B compile --file pom.xml

    - name: Ejecutar pruebas unitarias
      run: mvn -B test jacoco:report --file pom.xml

    # --- PARTE 3: PUBLICAR ARTEFACTOS ---

    - name: Publicar reporte de ejecucion de pruebas (Surefire)
      uses: actions/upload-artifact@v4
      if: always() # Se ejecuta incluso si fallan las pruebas para ver qué falló
      with:
        name: test-execution-report
        path: target/surefire-reports/

    - name: Publicar reporte de cobertura de codigo (JaCoCo)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage-report
        path: target/site/jacoco/